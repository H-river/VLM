# Tiny smoke-test config. Generate the dataset with:
# python optics_sft/scripts/make_tiny_synthetic_dataset.py --output-dir ../VLM_data/optics_sft_tiny

model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  train_jsonl: ../VLM_data/optics_sft_tiny/train.jsonl
  val_jsonl: ../VLM_data/optics_sft_tiny/val.jsonl
  image_root: ../VLM_data/optics_sft_tiny/images
  target_output_json_schema: sft_sample_schema.json

output:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_tiny

training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  num_train_epochs: 1
  max_steps: 3
  max_length: null
  bf16: true
  fp16: false
  eval_steps: 10
  save_steps: 10
  logging_steps: 1
  save_total_limit: 1
  gradient_checkpointing: false
  report_to: []

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
