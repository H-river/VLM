experiment:
  name: qwen25vl_3b_qlora_evidence_v5a_seed42

model:
  name: ../HF_models/Qwen2.5-VL-3B-Instruct
  local_files_only: true
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  dataset_format: prebuilt_chat
  train_jsonl: optics_understanding_sft/data/evidence_v5a/exports/qwen/train_trial50.jsonl
  val_jsonl: optics_understanding_sft/data/evidence_v5a/exports/qwen/dev.jsonl
  image_root: optics_understanding_sft/data/evidence_v5a

output:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_evidence_v5a_seed42

training:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_evidence_v5a_seed42
  seed: 42
  data_seed: 42
  sequential_train_sampler: true
  max_length: null
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 50
  learning_rate: 0.00001
  warmup_ratio: 0.10
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  save_total_limit: 2
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  report_to: []
  completion_only_loss: true
  assistant_only_loss: false

generation:
  max_new_tokens: 384
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
