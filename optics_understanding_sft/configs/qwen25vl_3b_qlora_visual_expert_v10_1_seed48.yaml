experiment:
  name: qwen25vl_3b_qlora_visual_expert_v10_1_seed48

model:
  name: ../HF_models/Qwen2.5-VL-3B-Instruct
  local_files_only: true
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  dataset_format: prebuilt_chat
  train_jsonl: optics_understanding_sft/data/visual_evidence_v10_1/exports/qwen/train_curriculum_visual_only_v10_1.jsonl
  val_jsonl: optics_understanding_sft/data/visual_evidence_v10_1/exports/qwen/dev.jsonl
  image_root: optics_understanding_sft/data/visual_evidence_v10_1

output:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_visual_expert_v10_1_seed48

training:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_visual_expert_v10_1_seed48
  seed: 48
  data_seed: 48
  sequential_train_sampler: true
  max_length: null
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 100
  learning_rate: 0.0001
  warmup_ratio: 0.10
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  report_to: []
  completion_only_loss: true
  assistant_only_loss: false
  decision_span_weight: 5.0
  decision_labels:
    - left_of_center
    - centered
    - right_of_center
    - above_center
    - below_center
    - narrow
    - medium
    - wide
    - increase
    - decrease
    - no_change
    - answerable

generation:
  max_new_tokens: 192
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - qkv
    - proj
    - gate_proj
    - up_proj
    - down_proj
