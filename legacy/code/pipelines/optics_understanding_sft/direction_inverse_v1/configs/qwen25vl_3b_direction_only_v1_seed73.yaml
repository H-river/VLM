experiment:
  name: qwen25vl_3b_direction_only_v1_seed73

model:
  name: ../HF_models/Qwen2.5-VL-3B-Instruct
  adapter_path: ../VLM_runs/qwen25vl_3b_qlora_corrective_v2_seed314
  local_files_only: true
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  dataset_format: prebuilt_chat
  train_jsonl: optics_understanding_sft/direction_inverse_v1/data/v1/exports/qwen/direction_train.jsonl
  val_jsonl: optics_understanding_sft/direction_inverse_v1/data/v1/exports/qwen/direction_val.jsonl
  image_root: optics_understanding_sft/direction_inverse_v1/data/v1

output:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_direction_only_v1_seed73

training:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_direction_only_v1_seed73
  seed: 73
  data_seed: 73
  sequential_train_sampler: false
  max_length: null
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 200
  learning_rate: 0.00001
  warmup_ratio: 0.08
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 4
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  report_to: []
  completion_only_loss: true
  assistant_only_loss: false
  decision_span_weight: 8.0
  decision_labels: [decrease, no_change, increase]

generation:
  max_new_tokens: 160
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
