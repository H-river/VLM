experiment:
  name: qwen25vl_3b_qlora_visual_mapping_repair_v10_10_seed55

model:
  name: ../HF_models/Qwen2.5-VL-3B-Instruct
  adapter_path: ../VLM_runs/qwen25vl_3b_qlora_visual_tool_orchestration_v10_2_seed49
  local_files_only: true
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  dataset_format: prebuilt_chat
  train_jsonl: optics_understanding_sft/data/visual_mapping_repair_v10_10/train_curriculum.jsonl
  val_jsonl: optics_understanding_sft/data/visual_mapping_repair_v10_10/dev_panel120.jsonl
  image_root: optics_understanding_sft/data/visual_mapping_repair_v10_10

output:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_visual_mapping_repair_v10_10_seed55

training:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_visual_mapping_repair_v10_10_seed55
  seed: 55
  data_seed: 55
  sequential_train_sampler: true
  max_length: null
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 20
  learning_rate: 0.000002
  warmup_ratio: 0.10
  logging_steps: 2
  eval_steps: 10
  save_steps: 10
  save_total_limit: 2
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  report_to: []
  completion_only_loss: true
  assistant_only_loss: false
  decision_span_weight: 8.0
  decision_labels:
    - answerable
    - insufficient_information
    - feasible
    - infeasible_within_limits

generation:
  max_new_tokens: 192
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
