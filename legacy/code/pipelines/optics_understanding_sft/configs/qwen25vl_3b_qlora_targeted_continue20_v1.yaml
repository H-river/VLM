experiment:
  name: qwen25vl_3b_qlora_targeted_continue20_v1

model:
  name: ../HF_models/Qwen2.5-VL-3B-Instruct
  adapter_path: ../VLM_runs/qwen25vl_3b_qlora_optics_understanding_trial40_v1/checkpoint-20
  local_files_only: true
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  dataset_format: prebuilt_chat
  train_jsonl: optics_understanding_sft/data/targeted_v1_1/exports/qwen/train_curriculum.jsonl
  val_jsonl: optics_understanding_sft/data/pilot_v1/exports/qwen/val.jsonl
  image_root: optics_understanding_sft/data/pilot_v1

output:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_targeted_continue20_v1

training:
  output_dir: ../VLM_runs/qwen25vl_3b_qlora_targeted_continue20_v1
  seed: 42
  data_seed: 202
  max_length: null
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 20
  learning_rate: 0.00003
  warmup_ratio: 0.05
  logging_steps: 1
  eval_steps: 10
  save_steps: 10
  save_total_limit: 3
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  report_to: []
  completion_only_loss: true
  assistant_only_loss: false

generation:
  max_new_tokens: 384
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
