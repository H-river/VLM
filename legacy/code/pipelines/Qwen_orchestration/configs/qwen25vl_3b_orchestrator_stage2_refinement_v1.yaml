experiment:
  name: qwen25vl_3b_orchestrator_stage2_refinement_v1_seed20260724

model:
  name: ../HF_models/Qwen2.5-VL-3B-Instruct
  adapter_path: ../VLM_runs/qwen_orchestrator_v1_stage2_seed20260724/checkpoint-2500
  local_files_only: true
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
  expected_language_lora_tensors: 504
  expected_visual_lora_tensors: 192

orchestration:
  decision_system_contract: true

data:
  dataset_format: prebuilt_chat
  train_jsonl: ../VLM_data/qwen_orchestration/refinement_v1/train_stage2_contract.jsonl
  val_jsonl: ../VLM_data/qwen_orchestration/refinement_v1/val_stage2_contract.jsonl
  image_root: ../VLM_data/qwen_orchestration/v1

output:
  output_dir: ../VLM_runs/qwen_orchestrator_v1_stage2_refinement_seed20260724

training:
  output_dir: ../VLM_runs/qwen_orchestrator_v1_stage2_refinement_seed20260724
  seed: 20260724
  data_seed: 20260724
  sequential_train_sampler: false
  max_length: null
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 750
  learning_rate: 0.000005
  warmup_ratio: 0.05
  logging_steps: 10
  eval_steps: 150
  save_steps: 150
  save_total_limit: 5
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  report_to: []
  completion_only_loss: true
  assistant_only_loss: false
  decision_span_weight: 32.0
  decision_labels:
    - qwen_orchestration_decision_v1
    - ready
    - needs_clarification
    - unsupported
    - beam_profile_measurement
    - direction_prediction
    - forward_prediction
    - inverse_control
    - measure_beam_profile_v1
    - predict_direction_from_state_v1
    - predict_direction_from_image_v1
    - predict_forward_from_state_v1
    - predict_forward_from_image_v1
    - select_inverse_action_from_states_v1
    - select_inverse_action_from_images_v1

generation:
  max_new_tokens: 768
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
