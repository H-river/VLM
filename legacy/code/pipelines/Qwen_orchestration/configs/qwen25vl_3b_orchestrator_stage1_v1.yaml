output:
  output_dir: ../VLM_runs/qwen_orchestrator_v1_stage1_seed20260724

training:
  output_dir: ../VLM_runs/qwen_orchestrator_v1_stage1_seed20260724
  seed: 20260724
  data_seed: 20260724
  sequential_train_sampler: false
  max_length: null
