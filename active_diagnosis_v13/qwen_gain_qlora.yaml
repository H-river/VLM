# Conditional Branch P/A config. Do not launch before the formal T+4 freeze and
# a development-only decision dataset has been built and audited.
model:
  name: /home/jiamo/HF_models/Qwen2.5-VL-3B-Instruct
  local_files_only: true
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  dataset_format: prebuilt_chat
  train_jsonl: /home/jiamo/VLM/runs/active_diagnosis_v13_20260801_010051/branch_a/decision_dataset/train.jsonl
  val_jsonl: /home/jiamo/VLM/runs/active_diagnosis_v13_20260801_010051/branch_a/decision_dataset/validation.jsonl
  image_root: /home/jiamo/VLM/runs/active_diagnosis_v13_20260801_010051/branch_a/decision_dataset

output:
  output_dir: /home/jiamo/VLM/runs/active_diagnosis_v13_20260801_010051/branch_a/qwen_gain_adapter

training:
  output_dir: /home/jiamo/VLM/runs/active_diagnosis_v13_20260801_010051/branch_a/qwen_gain_adapter
  max_length: null
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  max_steps: 60
  learning_rate: 0.0001
  warmup_ratio: 0.05
  logging_steps: 1
  eval_steps: 15
  save_steps: 15
  save_total_limit: 2
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  report_to: []
  completion_only_loss: true
  assistant_only_loss: false

generation:
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
