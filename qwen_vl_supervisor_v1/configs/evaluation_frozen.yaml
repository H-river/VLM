schema_version: qwen_vl_supervisor_evaluation_v1.0.0
protocol_state: frozen_before_formal_training_or_prediction
research_status: PROVISIONALLY READY FOR QWEN-VL

scope_guard:
  pre_server_protocol_freeze_artifact: required_before_server_training
  later_final_freeze_must_verify_pre_server_artifact_and_external_sha256: true
  formal_evaluation_during_pipeline_preparation: forbidden
  frozen_prediction_access_during_freeze: forbidden
  dev_prediction_access: allowed_for_checkpoint_and_threshold_selection_only
  qwen_role: high_level_supervisor_only
  continuous_actuator_output: forbidden
  continuous_action_source: frozen_h1_one_step_cem

finalization:
  final_checkpoint_path: REQUIRED_SERVER_SIDE_SELECTED_CHECKPOINT_BUNDLE_BEFORE_FREEZE
  final_checkpoint_sha256: REQUIRED_SERVER_SIDE_TREE_HASH_BEFORE_FREEZE
  training_config_path: qwen_vl_supervisor_v1/configs/training_server.yaml
  training_config_sha256: 4354f527460e59f085589153e5b071a7e9a29fbd41e6ca4f625a826463f913e5
  training_seeds: [2026080101, 2026080102, 2026080103]
  checkpoint_selection_rule:
    unit: each_declared_training_seed
    selection_split: dev_only
    eligible_checkpoints: all_complete_saved_checkpoints_for_that_seed
    rank_order:
      - highest_joint_diagnosis_policy_action_exact_accuracy
      - highest_diagnosis_macro_f1
      - highest_valid_json_rate
      - lowest_optimizer_step
      - lexicographically_lowest_checkpoint_tree_sha256
    cross_seed_policy: select_one_checkpoint_per_declared_training_seed_and_report_every_seed
    frozen_test_use: never_select_or_threshold_on_frozen_iid_or_frozen_ood
  threshold_selection_rule:
    source: dev_only
    qwen_decoding: deterministic_greedy_no_confidence_threshold
    baseline_thresholds: selected_on_dev_then_recorded_in_the_freeze_artifact
    frozen_test_retuning: forbidden

manifests:
  train:
    path: qwen_vl_supervisor_v1/manifests/manifest_train.jsonl
    legal_use: train_A_and_C_only
  dev:
    path: qwen_vl_supervisor_v1/manifests/manifest_dev.jsonl
    legal_use: checkpoint_baseline_and_threshold_selection_only
  frozen_iid:
    path: qwen_vl_supervisor_v1/manifests/manifest_frozen_iid.jsonl
    legal_use: one_formal_setup_disjoint_IID_evaluation_after_freeze
  frozen_ood:
    path: qwen_vl_supervisor_v1/manifests/manifest_frozen_ood.jsonl
    legal_use: one_formal_saturation_severity_OOD_evaluation_after_freeze
    limitation: contains_no_valid_width_relative_reflection_severity_OOD_records

comparison_matrix:
  A:
    name: strongest_metrics_only_rule_or_mlp
    model_visible_inputs:
      - current_five_metrics
      - goal_metrics
      - legal_recent_numerical_history
      - remaining_step_budget
      - legal_actuator_constraints
    forbidden_inputs:
      - current_image
      - anomaly_family
      - provenance
      - setup_or_pair_identity
      - future_or_post_decision_information
    candidates:
      - deterministic_frozen_rules
      - standardized_multinomial_logistic_regression
      - standardized_one_hidden_layer_mlp
    training_split: train
    selection_split: dev
    selection_rule:
      - highest_joint_diagnosis_policy_action_exact_accuracy
      - highest_diagnosis_macro_f1
      - highest_valid_json_rate
      - lowest_model_complexity
      - lexicographically_lowest_candidate_name
    output_contract: same_three_frozen_supervisor_enums_as_C
  B:
    name: previously_validated_small_image_diagnostic
    role: fixed_reference_not_a_VLM
    inputs: current_128x128_grayscale_image_plus_five_metrics
    evaluator_only_family_routing: forbidden
    unified_inference_rule:
      description: run_both_binary_specialists_then_apply_one_dev_frozen_arbitration
      score_domain: calibrated_probability_closed_unit_interval
      nominal_rule: both_scores_strictly_below_their_selected_thresholds
      anomaly_rule: otherwise_choose_larger_normalized_margin_above_threshold
      normalized_margin_formula: (score-threshold)/max(abs(threshold),1e-12)
      threshold_comparator_for_anomaly: greater_than_or_equal
      tie_order: [nominal, sensor_saturation, secondary_reflection]
      threshold_source: dev_only
      output_mapping:
        nominal: [nominal, standard, execute]
        sensor_saturation: [sensor_saturation, lower_exposure_reacquire, reacquire]
        secondary_reflection: [secondary_reflection, primary_spot, switch_measurement]
    fixed_specialists:
      saturation_multimodal_small_model:
        path: runs/vlm_optics_benchmark_20260801_154812/models/sensor_saturation_multimodal_cnn.pt
        sha256: 2613628028a122a73c9cac8705cb8ec49125d8d00bf45ef18b12c19722acf5b7
      width_relative_reflection_selected_diagnostic:
        path: reflection_width_relative/models/selected_diagnostic.pt
        sha256: 45f95f6c580842dcdd5dcaa61a7eff732f071343dd7ce8c748d701051e5555bb
    scientific_caveat: reflection_specialist_is_a_provisional_reference_and_did_not_strictly_pass_every_preregistered_gate
  C:
    name: qwen_vl_supervisor
    inputs: exactly_one_current_image_plus_the_frozen_structured_model_input_allowlist
    output: exactly_one_canonical_JSON_object_with_three_frozen_enums
    checkpoint_policy: one_dev_selected_checkpoint_for_every_declared_training_seed
    decoding:
      do_sample: false
      num_beams: 1
      temperature: null
      top_p: null
      output_continuous_actuator_actions: forbidden
  D:
    name: oracle_diagnosis_and_decision
    inputs: evaluator_only_ground_truth
    output_mapping:
      nominal: [nominal, standard, execute]
      sensor_saturation: [sensor_saturation, lower_exposure_reacquire, reacquire]
      secondary_reflection: [secondary_reflection, primary_spot, switch_measurement]
    continuous_actions: still_selected_only_by_the_same_frozen_controller
    role: upper_bound_not_deployable

offline_evaluation:
  splits: [frozen_iid, frozen_ood]
  primary_split: frozen_iid
  prediction_join_key: sample_id
  invalid_or_missing_predictions: count_as_incorrect_for_every_supervised_field
  required_metrics:
    - valid_json_rate
    - diagnosis_balanced_accuracy
    - diagnosis_macro_f1
    - diagnosis_per_class_precision
    - diagnosis_per_class_recall
    - measurement_policy_accuracy
    - supervisor_action_macro_f1
    - joint_diagnosis_policy_action_exact_accuracy
    - diagnosis_confusion_matrix
    - measurement_policy_confusion_matrix
    - supervisor_action_confusion_matrix
    - performance_by_anomaly_family
    - reflection_performance_by_beam_width_quartile
    - boundary_versus_non_boundary_performance
    - performance_by_severity
  denominators:
    valid_json_rate: every_expected_record
    field_metrics: records_where_that_target_field_mask_is_true
    joint_exact: records_where_all_three_target_field_masks_are_true
    absent_class_behavior: report_support_zero_and_do_not_invent_a_score
  continue_stop_masking:
    static_anomaly_policy_records_have_valid_execute_reacquire_or_switch_measurement_targets: true
    per_class_continue_stop_scores_on_static_records: forbidden
    future_records_without_temporal_action_supervision: mask_supervisor_action_and_exclude_from_action_and_joint_denominators
    generated_continue_or_stop_on_a_supervised_static_action_record: incorrect_for_action_and_joint_metrics
  training_seed_reporting:
    seed_source: every_seed_declared_by_the_hashed_training_server_config
    report_each_seed: true
    aggregate_statistics: [mean, population_standard_deviation, minimum, maximum]
    suppress_unfavorable_seed_or_subgroup: forbidden
  offline_arm_seed_semantics:
    C:
      prediction_rows: every_declared_integer_training_seed
      reducer_seed_gate: evaluation_config
      duplication: forbidden_beyond_one_row_per_sample_per_training_seed
    A_B_D:
      prediction_rows: one_deterministic_output_per_sample_with_seed_label_deterministic_reference
      reducer_seed_gate: expected_seeds_deterministic_reference
      duplicate_across_C_training_seeds: forbidden

subgroups:
  anomaly_family:
    source: provenance.anomaly_family
    values: [sensor_saturation, secondary_reflection]
    include_nominal_counterfactual_pair_members: true
    note: evaluator_metadata_only_never_model_input_and_distinct_from_target_diagnosis
  diagnosis_class:
    source: target.diagnosis
    values: [nominal, sensor_saturation, secondary_reflection]
  reflection_width_quartile:
    source: provenance.width_quartile
    values: [Q1, Q2, Q3, Q4]
    include_nominal_counterfactual_pair_members: true
  boundary_status:
    source: provenance.boundary_status
    values: [boundary, non_boundary]
    include_nominal_counterfactual_pair_members: true
  severity:
    source: provenance.severity_bucket
    report_every_observed_bucket: true
    width_relative_severity_ood_conclusion: unavailable
  minimum_support_policy: always_report_n_and_metric_even_when_n_is_small

closed_loop_evaluation:
  arms: [A, B, C, D]
  paired_invariants:
    identical_initial_states: true
    identical_setup_groups: true
    identical_target_states: true
    identical_planner_root_seeds: true
    identical_cem_population_and_sampling_budget: true
    identical_numerical_action_budget: true
    identical_maximum_step_budget: true
    deep_copy_initial_state_per_arm: true
  suite_registry:
    sensor_saturation:
      path: runs/vlm_optics_benchmark_20260801_154812/external_suite_manifest.json
      sha256: 02a7033a77d55ebbfa6bca4e81b6a46d47dfe30e1de8173525255147e04a98cf
      legal_use: evaluation_only
    width_relative_reflection:
      path: reflection_width_relative/suites/iid_heldout_suite.json
      sha256: 500bd912049b0775255018d3feaea237745552db70f51e8dba1c6cd074ec55f6
      legal_use: evaluation_only
  controller:
    official_backbone: branch_a_probe_replan_h1_cem_with_frozen_visible_sequential_rule_max8
    forward_model: learned_H1_ensemble_three_members
    imagined_model_horizon: 1
    planner: one_step_CEM_replanned_after_every_real_observation
    gain_handling: frozen_gain_aware_probe_and_replanning_where_applicable
    continuation: frozen_visible_rule_using_real_observations_only
    maximum_horizon: 8
    population: 24
    elites: 6
    cem_iterations: 3
    success_threshold_normalized_tolerances: 1.0
    target_distance: maximum_absolute_error_in_initial_state_tolerances
    recovery_adds_actuator_steps: false
    per_step_action_bounds_mm:
      lens_x: [-0.05, 0.05]
      lens_y: [-0.05, 0.05]
      camera_x: [-0.02, 0.02]
      camera_y: [-0.02, 0.02]
  evaluation_seeds:
    planner_root_seeds: [2026081101, 2026081102]
    provenance: previously_preregistered_frozen_controller_seeds_reused_as_defaults
    finalization_rule: exact_list_is_hashed_by_freeze_utility_and_must_not_change_after_any_formal_prediction
    paired_bootstrap_seed: 2026081199
    paired_bootstrap_samples: 10000
  required_metrics:
    - strict_all_five_success
    - matched_recoveries
    - matched_regressions
    - final_normalized_target_distance
    - executed_steps
    - actuator_saturation
    - hard_constraint_violations
    - results_by_family
    - results_by_width_quartile
    - results_by_boundary_status
    - exact_qwen_versus_oracle_disagreements
    - diagnosis_correct_but_control_failed_cases
    - diagnosis_wrong_but_accidentally_recovered_cases
  reporting:
    every_training_seed: true
    every_planner_seed: true
    aggregate_over_training_and_planner_seeds: true
    matched_recovery_reference_arm: A
    disagreements_include_exact_setup_hash_and_paired_outcomes: true

