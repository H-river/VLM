known_reflection_limitations:
  engineering_decision: provisional_GO_for_Qwen_VL_training
  strict_preregistered_pass_claim: forbidden
  Q1_narrow_beam_accuracy_percent: 68.75
  width_quartile_gap_percentage_points: 31.25
  boundary_accuracy_percent: 75.0
  valid_width_relative_severity_OOD_conclusion: false
  visibility_rule: Q1_and_boundary_results_must_appear_in_every_seed_report_and_aggregate

primary_research_tests:
  test_1:
    question: Does_Qwen_VL_outperform_A_on_setup_disjoint_IID
    primary_metric: diagnosis_balanced_accuracy
    comparison_statistic: mean_over_all_declared_C_training_seeds_minus_the_single_dev_selected_A_baseline
    pass_rule: comparison_statistic_strictly_greater_than_0_on_frozen_IID
    visibility_rule: every_individual_C_seed_and_the_aggregate_must_be_reported
  test_2:
    question: Does_Qwen_VL_improve_closed_loop_success_without_material_safety_regression
    efficacy_rule: C_minus_A_strict_success_at_least_0.05_OR_at_least_5_matched_recoveries
    safety_rule:
      maximum_actuator_saturation_rate_increase: 0.05
      maximum_hard_constraint_violation_count_increase: 0
    pass_rule: efficacy_rule_AND_safety_rule
  test_3:
    question: How_close_is_Qwen_VL_to_B_and_D
    rule: descriptive_absolute_and_paired_gaps_for_all_offline_and_closed_loop_primary_metrics
  test_4:
    question: Does_the_reflection_Q1_boundary_weakness_remain
    rule: always_report_Q1_Q2_Q3_Q4_and_boundary_non_boundary_with_support_for_every_seed_and_aggregate
    pass_fail_use: descriptive_only_and_never_relabels_reflection_as_a_strict_pass

exact_commands:
  prepare_protocol_artifact: >-
    python qwen_vl_supervisor_v1/scripts/freeze_evaluation.py prepare
    --config qwen_vl_supervisor_v1/configs/evaluation_frozen.yaml
    --output qwen_vl_supervisor_v1/artifacts/evaluation_protocol_freeze.json
    --authorize-pre-server-protocol-freeze
  create_freeze_artifact: >-
    python qwen_vl_supervisor_v1/scripts/freeze_evaluation.py freeze
    --config qwen_vl_supervisor_v1/configs/evaluation_frozen.yaml
    --output qwen_vl_supervisor_v1/artifacts/evaluation_freeze.json
    --preparation-artifact qwen_vl_supervisor_v1/artifacts/evaluation_protocol_freeze.json
    --preparation-artifact-sha256 "$EVALUATION_PROTOCOL_FREEZE_SHA256"
    --final-checkpoint "$FINAL_CHECKPOINT"
    --final-checkpoint-sha256 "$FINAL_CHECKPOINT_SHA256"
    --training-config qwen_vl_supervisor_v1/configs/training_server.yaml
    --training-config-sha256 "$TRAINING_CONFIG_SHA256"
    --dev-selection-artifact "$DEV_SELECTION_ARTIFACT"
    --dev-selection-artifact-sha256 "$DEV_SELECTION_ARTIFACT_SHA256"
    --baseline-dev-selection-artifact "$BASELINE_DEV_SELECTION_ARTIFACT"
    --baseline-dev-selection-artifact-sha256 "$BASELINE_DEV_SELECTION_ARTIFACT_SHA256"
    --prediction-runner "$PREDICTION_RUNNER"
    --prediction-runner-sha256 "$PREDICTION_RUNNER_SHA256"
    --prediction-command "$PREDICTION_COMMAND"
    --closed-loop-runner "$CLOSED_LOOP_RUNNER"
    --closed-loop-runner-sha256 "$CLOSED_LOOP_RUNNER_SHA256"
    --closed-loop-command "$CLOSED_LOOP_COMMAND"
    --authorize-formal-evaluation-freeze
  verify_formal_gate: >-
    python qwen_vl_supervisor_v1/scripts/freeze_evaluation.py verify
    --freeze-artifact qwen_vl_supervisor_v1/artifacts/evaluation_freeze.json
    --freeze-artifact-sha256 "$EVALUATION_FREEZE_SHA256"
    --final-checkpoint "$FINAL_CHECKPOINT"
    --final-checkpoint-sha256 "$FINAL_CHECKPOINT_SHA256"
    --training-config qwen_vl_supervisor_v1/configs/training_server.yaml
    --training-config-sha256 "$TRAINING_CONFIG_SHA256"
    --formal-evaluation
  offline_reduce_formal_matrix: >-
    set -euo pipefail;
    for SPLIT in frozen_iid frozen_ood; do
    for ARM in A B D; do
    python -m qwen_vl_supervisor_v1.evaluate_offline
    --manifest "qwen_vl_supervisor_v1/manifests/manifest_${SPLIT}.jsonl"
    --predictions "$FORMAL_OUTPUT/$SPLIT/arm_${ARM}_predictions.jsonl"
    --expected-seeds deterministic_reference
    --output "$FORMAL_OUTPUT/$SPLIT/offline_arm_${ARM}.json";
    done;
    python -m qwen_vl_supervisor_v1.evaluate_offline
    --manifest "qwen_vl_supervisor_v1/manifests/manifest_${SPLIT}.jsonl"
    --predictions "$FORMAL_OUTPUT/$SPLIT/arm_C_predictions_all_training_seeds.jsonl"
    --evaluation-config qwen_vl_supervisor_v1/configs/evaluation_frozen.yaml
    --output "$FORMAL_OUTPUT/$SPLIT/offline_arm_C.json";
    done
  prediction_and_closed_loop_runner: REQUIRED_SERVER_SIDE_INTEGRATION_COMMAND_AND_SHA256_BEFORE_FREEZE
  command_policy: run_verify_formal_gate_with_shell_AND_before_any_formal_prediction_or_closed_loop_command

claims:
  sensor_saturation: formally_validated
  width_relative_reflection: provisional_engineering_GO_only
  smoke_test_can_validate_scientific_performance: false
  formal_frozen_evaluation_completed: false
